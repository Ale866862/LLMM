<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inspector DOM | Estilo Morado</title>
    <style>
        :root {
            --neon-purple: #6a0dad;
            --dark-bg: #050505;
        }

        body { background: var(--dark-bg); color: white; font-family: sans-serif; padding: 20px; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        .card { 
            background: #0f0f0f; 
            padding: 20px; 
            border-left: 4px solid var(--neon-purple);
            border-radius: 8px;
            animation: slideUp 0.6s ease-out;
            overflow: hidden;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--neon-purple); margin-bottom: 15px; }

        .item { 
            background: #1a1a1a; 
            padding: 8px; 
            margin: 5px 0; 
            border-radius: 4px; 
            font-size: 0.85rem; 
            word-break: break-all;
            transition: 0.3s;
        }

        .item:hover { background: var(--neon-purple); cursor: pointer; }

        button {
            margin: 20px 0;
            padding: 15px 30px;
            background: var(--neon-purple);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { box-shadow: 0 0 20px var(--neon-purple); transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>Inspector de Propiedades del Documento</h1>
    <button onclick="inspeccionar()">Analizar Página</button>

    <div class="dashboard" id="panel"></div>

    

    <script>
        function inspeccionar() {
            const panel = document.getElementById("panel");
            panel.innerHTML = ""; // Limpiar previo

            // 1. Título
            crearTarjeta("Título", [document.title]);

            // 2. Imágenes (convertimos HTMLCollection a Array)
            const imgs = Array.from(document.images).map(img => img.src);
            crearTarjeta("Imágenes (src)", imgs);

            // 3. Enlaces
            const links = Array.from(document.links).map(link => link.href);
            crearTarjeta("Enlaces (href)", links);

            // Mostrar también en consola como pide el ejercicio
            console.log("Título:", document.title);
            console.log("Imágenes:", document.images);
            console.log("Enlaces:", document.links);
        }

        function crearTarjeta(titulo, datos) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<h2>${titulo}</h2>`;
            
            datos.forEach(dato => {
                const item = document.createElement("div");
                item.className = "item";
                item.innerText = dato;
                card.appendChild(item);
            });
            
            document.getElementById("panel").appendChild(card);
        }
    </script>
</body>
</html>
