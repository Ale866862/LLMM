<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Temporizador setTimeout | Ejercicio 8</title>
    <style>
        :root {
            --neon-purple: #6a0dad;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: #0f0f0f;
            border: 1px solid var(--neon-purple);
            border-radius: 20px;
            width: 300px;
        }

        /* Barra de progreso animada */
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #222;
            margin-top: 20px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--neon-purple);
            width: 0%;
            transition: width 5s linear; /* La animación dura exactamente los 5s */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Temporizador Activo</h2>
        <p>El mensaje aparecerá en 5 segundos...</p>
        <div class="progress-bar">
            <div id="fill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        // Función que ejecutará el setTimeout
        function mostrarMensaje() {
            alert("¡Hola! Han transcurrido 5 segundos.");
        }

        // Ejecutar el temporizador al cargar la página
        window.onload = function() {
            // Animación de la barra
            document.getElementById("fill").style.width = "100%";
            
            // Función setTimeout (5000ms = 5 segundos)
            setTimeout(mostrarMensaje, 5000);
        };
    </script>
</body>
</html>
