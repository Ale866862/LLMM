<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor de Código Pro | Purple Edition</title>
    <style>
        :root {
            --neon-purple: #6a0dad;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .editor-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            height: 60vh;
        }

        textarea {
            flex: 1;
            background: #111;
            color: #a855f7;
            padding: 15px;
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            resize: none; /* Requisito solicitado */
            outline: none;
        }

        #resultado {
            flex: 1;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        h2 { color: var(--neon-purple); text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <h2>Editor HTML & CSS En Vivo</h2>

    <div class="editor-container">
        <textarea id="codigo" placeholder="Escribe tu HTML/CSS aquí...">
<h1 style="color: purple;">¡Hola Mundo!</h1>
<p>Este es un editor en tiempo real.</p>
        </textarea>
        
        <div id="resultado">
            <iframe id="iframe-resultado"></iframe>
        </div>
    </div>

    <script>
        const codigo = document.getElementById('codigo');
        const iframe = document.getElementById('iframe-resultado');

        // Función que actualiza el iframe cada vez que se escribe
        codigo.addEventListener('input', () => {
            const contenido = codigo.value;
            // srcdoc permite inyectar código directamente en el iframe
            iframe.srcdoc = contenido;
        });

        // Carga inicial
        iframe.srcdoc = codigo.value;
    </script>
</body>
</html>
