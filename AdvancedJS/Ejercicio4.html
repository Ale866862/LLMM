<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Tablas | Estilo Morado</title>
    <style>
        :root {
            --neon-purple: #6a0dad;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .calc-card {
            background: #0f0f0f;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--neon-purple);
            text-align: center;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: var(--neon-purple);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #a855f7; box-shadow: 0 0 10px var(--neon-purple); }

        #tabla-resultado {
            margin-top: 20px;
            list-style: none;
            padding: 0;
        }

        .fila {
            padding: 8px;
            border-bottom: 1px solid #222;
            animation: aparecer 0.5s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="calc-card">
        <h2>Generador de Tablas</h2>
        <input type="number" id="numero" placeholder="Introduce un número">
        <button onclick="generarTabla()">Generar Tabla</button>
        <ul id="tabla-resultado"></ul>
    </div>

    <script>
        function generarTabla() {
            const numero = document.getElementById("numero").value;
            const lista = document.getElementById("tabla-resultado");
            
            // Limpiar tabla anterior
            lista.innerHTML = "";

            if (numero === "") {
                alert("Por favor, introduce un número.");
                return;
            }

            // Generar tabla del 1 al 10
            for (let i = 1; i <= 10; i++) {
                let li = document.createElement("li");
                li.className = "fila";
                li.innerHTML = `${numero} × ${i} = <strong>${numero * i}</strong>`;
                lista.appendChild(li);
            }
        }
    </script>
</body>
</html>
