<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Image Slider | Purple & Black</title>
    <style>
        /* Estilos Globales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal */
        .slider-container {
            position: relative;
            width: 80vw;
            height: 80vh;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #6a0dad; /* Morado */
            box-shadow: 0 0 30px rgba(106, 13, 173, 0.4);
        }

        /* Imágenes */
        .img-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            transition: all 0.8s ease-in-out;
            animation: zoomEffect 10s infinite alternate;
        }

        @keyframes zoomEffect {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Overlay para mejorar legibilidad */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0,0,0,0.7) 0%, rgba(106, 13, 173, 0.2) 100%);
        }

        /* Botones */
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(106, 13, 173, 0.2);
            color: white;
            padding: 15px 20px;
            border: 1px solid #6a0dad;
            cursor: pointer;
            font-size: 2rem;
            border-radius: 50%;
            transition: 0.3s;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: #6a0dad;
            box-shadow: 0 0 20px #6a0dad;
        }

        .btn-left { left: 20px; }
        .btn-right { right: 20px; }

        /* Título del Proyecto */
        .content {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: white;
            z-index: 5;
        }

        .content h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .content span {
            color: #a855f7; /* Morado claro */
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <div class="img-container"></div>
        <div class="overlay"></div>

        <button class="btn btn-left" id="prevBtn">&#10094;</button>
        <button class="btn btn-right" id="nextBtn">&#10095;</button>

        <div class="content">
            <h1>Slider <span>Moderno</span></h1>
        </div>
    </div>

    <script>
        (function() {
            // Array de imágenes (puedes cambiarlas por las que quieras)
            const pictures = [
                "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1534972195531-d756b9bfa9f2?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&w=1200&q=80"
            ];

            const imgContainer = document.querySelector('.img-container');
            const buttons = document.querySelectorAll('.btn');
            let counter = 0;

            // Inicializar con la primera imagen
            imgContainer.style.backgroundImage = `url('${pictures[0]}')`;

            buttons.forEach(function(button) {
                button.addEventListener('click', function(e) {
                    // Animación de salida rápida
                    imgContainer.style.opacity = "0";

                    setTimeout(() => {
                        if (button.classList.contains('btn-left')) {
                            counter--;
                            if (counter < 0) {
                                counter = pictures.length - 1;
                            }
                        }

                        if (button.classList.contains('btn-right')) {
                            counter++;
                            if (counter > pictures.length - 1) {
                                counter = 0;
                            }
                        }

                        imgContainer.style.backgroundImage = `url('${pictures[counter]}')`;
                        imgContainer.style.opacity = "1";
                    }, 300); // Tiempo de la transición
                });
            });
        })();
    </script>
</body>
</html>
