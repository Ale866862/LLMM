<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica Pro | Purple Edition</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0f0f0f;
            --neon-purple: #6a0dad;
            --light-purple: #a855f7;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .calc-container {
            background: var(--card-bg);
            width: 400px;
            padding: 25px;
            border-radius: 30px;
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 40px rgba(106, 13, 173, 0.2);
            position: relative;
        }

        /* Pantalla Dual: Operación actual y Resultado */
        .display {
            background: #000;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 15px;
            text-align: right;
            border: 1px solid #222;
            box-shadow: inset 0 0 15px rgba(106, 13, 173, 0.4);
        }

        #upper-display {
            font-size: 0.9rem;
            color: #666;
            min-height: 1.2rem;
            margin-bottom: 5px;
        }

        #main-display {
            font-size: 2.2rem;
            color: var(--light-purple);
            overflow-x: auto;
            white-space: nowrap;
        }

        /* Rejilla de Botones */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px 5px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
            transform: translateY(-2px);
        }

        .btn:active { transform: scale(0.95); }

        /* Estilos específicos */
        .btn-sci { background: #240046; color: var(--light-purple); font-weight: bold; }
        .btn-op { background: #3c096c; color: white; }
        .btn-clear { background: #4a0000; color: #ff4d4d; }
        .btn-equal { 
            background: var(--neon-purple); 
            grid-column: span 2; 
            font-size: 1.5rem;
        }

        /* Scrollbar para la pantalla */
        #main-display::-webkit-scrollbar { height: 4px; }
        #main-display::-webkit-scrollbar-thumb { background: var(--neon-purple); }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="display">
            <div id="upper-display"></div>
            <div id="main-display">0</div>
        </div>

        <div class="buttons-grid">
            <button class="btn btn-sci" onclick="push('Math.sin(')">sin</button>
            <button class="btn btn-sci" onclick="push('Math.cos(')">cos</button>
            <button class="btn btn-sci" onclick="push('Math.tan(')">tan</button>
            <button class="btn btn-sci" onclick="push('Math.log10(')">log</button>
            <button class="btn btn-clear" onclick="clearScreen()">C</button>

            <button class="btn btn-sci" onclick="push('Math.PI')">π</button>
            <button class="btn btn-sci" onclick="push('Math.E')">e</button>
            <button class="btn btn-sci" onclick="push('**')">^</button>
            <button class="btn btn-sci" onclick="push('Math.sqrt(')">√</button>
            <button class="btn btn-op" onclick="backspace()">⌫</button>

            <button class="btn" onclick="push('7')">7</button>
            <button class="btn" onclick="push('8')">8</button>
            <button class="btn" onclick="push('9')">9</button>
            <button class="btn btn-op" onclick="push('(')">(</button>
            <button class="btn btn-op" onclick="push(')')">)</button>

            <button class="btn" onclick="push('4')">4</button>
            <button class="btn" onclick="push('5')">5</button>
            <button class="btn" onclick="push('6')">6</button>
            <button class="btn btn-op" onclick="push('*')">×</button>
            <button class="btn btn-op" onclick="push('/')">÷</button>

            <button class="btn" onclick="push('1')">1</button>
            <button class="btn" onclick="push('2')">2</button>
            <button class="btn" onclick="push('3')">3</button>
            <button class="btn btn-op" onclick="push('+')">+</button>
            <button class="btn btn-op" onclick="push('-')">-</button>

            <button class="btn" onclick="push('0')">0</button>
            <button class="btn" onclick="push('.')">.</button>
            <button class="btn btn-sci" onclick="push('Math.exp(')">exp</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const mainDisplay = document.getElementById('main-display');
        const upperDisplay = document.getElementById('upper-display');
        let currentInput = "";

        function push(value) {
            if (mainDisplay.innerText === "0" || mainDisplay.innerText === "Error") {
                currentInput = value;
            } else {
                currentInput += value;
            }
            updateDisplay();
        }

        function clearScreen() {
            currentInput = "";
            upperDisplay.innerText = "";
            mainDisplay.innerText = "0";
        }

        function backspace() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
            if (currentInput === "") mainDisplay.innerText = "0";
        }

        function updateDisplay() {
            // Reemplazamos los términos internos por símbolos legibles para el usuario
            let view = currentInput
                .replace(/Math\.sin\(/g, 'sin(')
                .replace(/Math\.cos\(/g, 'cos(')
                .replace(/Math\.tan\(/g, 'tan(')
                .replace(/Math\.log10\(/g, 'log(')
                .replace(/Math\.PI/g, 'π')
                .replace(/Math\.E/g, 'e')
                .replace(/Math\.sqrt\(/g, '√(')
                .replace(/\*\*/g, '^');
            
            mainDisplay.innerText = view || "0";
        }

        function calculate() {
            try {
                upperDisplay.innerText = mainDisplay.innerText + " =";
                // Evalúa la expresión matemática
                let result = eval(currentInput);
                
                // Limitar decimales si es necesario
                if (result.toString().includes('.')) {
                    result = parseFloat(result.toFixed(8));
                }
                
                mainDisplay.innerText = result;
                currentInput = result.toString();
            } catch (e) {
                mainDisplay.innerText = "Error";
                currentInput = "";
            }
        }
    </script>
</body>
</html>
